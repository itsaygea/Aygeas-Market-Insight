name: Build and Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      DALAMUD_HOME: ${{ github.workspace }}/dalamud
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Download Dalamud
        shell: bash
        run: |
          curl -sL https://goatcorp.github.io/dalamud-distrib/latest.zip -o dalamud.zip
          unzip dalamud.zip -d "$DALAMUD_HOME"

      - name: Build
        run: dotnet build --configuration Release

      - name: Package
        shell: bash
        run: |
          mkdir -p staging
          cp bin/Release/net10.0-windows/AygeaMarketInsight.dll staging/
          cp bin/Release/net10.0-windows/AygeaMarketInsight.json staging/
          cp bin/Release/net10.0-windows/AygeaMarketInsight.pdb staging/
          cd staging && 7z a ../latest.zip ./*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: latest.zip
          generate_release_notes: true
